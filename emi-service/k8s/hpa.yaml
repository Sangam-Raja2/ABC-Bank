apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: emi-service-hpa
  namespace: abcbank
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: emi-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
