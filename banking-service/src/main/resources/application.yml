server:
  port: 8082
  error:
    include-stacktrace: always

spring:
  application:
    name: banking-service

  datasource:
    url: jdbc:postgresql://localhost:5432/bankingdb
    driver-class-name: org.postgresql.Driver
    username: sa
    password: password

    jpa:
      hibernate:
        ddl-auto: update

      show-sql: true

      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.PostgreSQLDialect

    sql:
      init:
        mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Must be identical to the secret configured in user-service so that JWTs
# issued at login can be validated here without a network call.
jwt:
  secret: ${JWT_SECRET:abcBank$ecretKeyForJWTSigning_MustBeAtLeast256BitsLong_ChangeInProd}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}




logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate: DEBUG
    com.sangam.abcbank: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha